  <rect x="16" y="9" width="7" height="7" rx="1.2" fill="#6FAE3E"/>
  <rect x="25" y="17" width="9" height="9" rx="1.5" fill="#6FAE3E"/>
  <rect x="36" y="26" width="11" height="11" rx="2" fill="#6FAE3E"/>

  <!-- "i" stem -->
