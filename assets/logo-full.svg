  <text x="50" y="155" text-anchor="middle" font-family="'Arial Black', Arial, Helvetica, sans-serif" font-weight="900" font-size="21" letter-spacing="1.5" fill="#6FAE3E">PACK</text>
  <rect x="74" y="142.5" width="17" height="3" rx="1.5" fill="#171a17"/>
