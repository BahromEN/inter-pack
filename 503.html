<!DOCTYPE html>

<style>
.error-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;

}
.error-page .container{max-width:560px;}
.error-page .logo-row{

  justify-content:center;
  gap:10px;
  margin-bottom:48px;
}
.error-page .logo-row img{height:34px;}
.error-page .logo-row span{
  font-size:19px;letter-spacing:.02em;color:var(--c-text);
}
.error-page .logo-row span b{color:var(--c-accent-deep);font-weight:600;}
.error-icon{
  width:72px;height:72px;margin:0 auto 28px;
  color:var(--c-accent-deep);
}
.error-page h1{font-size:clamp(22px,3vw,30px);font-weight:400;margin-bottom:14px;}
.error-page p{font-size:16px;max-width:420px;margin:0 auto 34px;}
.error-actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}

    <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 7v6"/><path d="M12 16.5h.01"/></svg>

    <div class="error-actions">
      <a href="/#contacts" class="btn btn-accent">Связаться с нами</a>
    </div>
  </div>
